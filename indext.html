<!DOCTYPE html>
<html lang="en">
<head>
<title>Toko Buahku</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* Style the header */
header {
  background-color: #666;
  padding: 30px;
  text-align: center;
  font-size: 35px;
  color: rgb(62, 13, 169);
  background-image: url(toko1.jpg);
  background-size: 20cap;
}

/* Create two columns/boxes that floats next to each other */
nav {
  float: left;
  width: 30%;
  height: 300px; /* only for demonstration, should be removed */
  background: #ccc;
  padding: 20px;
}

/* Style the list inside the menu */
nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: left;
  padding: 50px;
  width: 100%;
  background-color: #f1f1f1;
  height: 300px; /* only for demonstration, should be removed */
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Style the footer */
footer {
  background-color: #777;
  padding: 10px;
  text-align: center;
  color: white;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  nav, article {
    width: 100%;
    height: auto;
  }
}
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #4a0dbb;
}

ul li {
  float: left;
}

ul li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

ul li a:hover {
  background-color: #111111;
}

</style>
</head>
<body>

    <ul>

  <li><a href="Produk.html">produk</a></li>
</ul>

<header>
  <h2>Welcome</h2>
</header>

<section>
  
  <article>
    <h1>Profile toko</h1>
    <p>Hai, selamat datang ditoko buaku . Disini kami menjual berbagai jenis buah segar dan berkulaitas.Toko kami sudah berdiri sejak tahun 2025 dan sudah dipercayai oleh banyak customer bahwa toko kami memiliki buah buahan yg berkualitas.
  </article>
</section>

<footer>
  <p>Footer</p>
</footer>

</body>
</html>
